# Captivo Access — self-host package.
# Usage: cp .env.example .env && edit it && docker compose up -d
# The Manager is meant to be deployed on an internet-reachable host (cloud/DMZ).
name: captivo-access

services:
  access-postgres:
    image: postgres:16-alpine
    container_name: access-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: access
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: captivo_access
    volumes:
      - access_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432" # host 5434 — avoids clashing with Captivo's 5432/5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d captivo_access"]
      interval: 5s
      timeout: 3s
      retries: 10

  access-manager:
    build: .
    container_name: access-manager
    restart: unless-stopped
    depends_on:
      access-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://access:${POSTGRES_PASSWORD:?required}@access-postgres:5432/captivo_access
      SESSION_SECRET: ${SESSION_SECRET:?required}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      # TOTP recovery-secret encryption (AES-256-GCM) — required by the identity layer (Slice 1)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-48}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      NODE_ENV: production
    ports:
      - "3100:3100"

volumes:
  access_pgdata: {}
