# Captivo Access — self-host package.
# Usage: cp .env.example .env && edit it && docker compose up -d
# The Manager is meant to be deployed on an internet-reachable host (cloud/DMZ).
name: captivo-access

services:
  access-postgres:
    image: postgres:16-alpine
    container_name: access-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: access
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: captivo_access
    volumes:
      - access_pgdata:/var/lib/postgresql/data
    ports:
      - "5434:5432" # host 5434 — avoids clashing with Captivo's 5432/5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U access -d captivo_access"]
      interval: 5s
      timeout: 3s
      retries: 10

  access-manager:
    build: .
    container_name: access-manager
    restart: unless-stopped
    depends_on:
      access-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://access:${POSTGRES_PASSWORD:?required}@access-postgres:5432/captivo_access
      SESSION_SECRET: ${SESSION_SECRET:?required}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      # TOTP recovery-secret encryption (AES-256-GCM) — required by the identity layer (Slice 1)
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?required}
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-48}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      NODE_ENV: production
      # Data-plane wiring (Slice 2) — the Manager talks to the data-plane's
      # internal API (not the public WSS port) to proxy requests to connectors.
      DATAPLANE_URL: http://access-dataplane:3102
      DATAPLANE_SECRET: ${DATAPLANE_SECRET:?required}
      # Cross-subdomain SSO cookie domain (Slice 4) — empty = host-only cookie.
      # Set to e.g. .access.example.com in production so the session cookie
      # is readable on both the Manager and every <site>.access.example.com.
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # The Manager's own public URL — used to build absolute login redirects
      # (e.g. from the data-plane's proxy back to /login?returnTo=...).
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-http://localhost:3100}
      # Audit trail retention (Slice 5) — days AuditEvent rows are kept before
      # POST /api/cron/audit-retention deletes them. CRON_SECRET authorizes
      # that endpoint (Bearer token); leave unset to keep it disabled.
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-730}
      CRON_SECRET: ${CRON_SECRET:-}
      # Optional outbound alert when a Site goes down or recovers (best-effort
      # POST). Unset = disabled. See deploy/.env.prod.example.
      NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}
    ports:
      - "3100:3100"

  access-dataplane:
    build:
      context: .
      dockerfile: dataplane/Dockerfile
    container_name: access-dataplane
    restart: unless-stopped
    depends_on:
      access-manager:
        condition: service_started
    environment:
      DATAPLANE_SECRET: ${DATAPLANE_SECRET:?required}
      CONTROL_PLANE_URL: http://access-manager:3100
      WSS_ADDR: ":3101"
      INTERNAL_ADDR: ":3102"
      # Browser-facing identity-aware proxy listener (Slice 4) — this is the
      # port a front reverse proxy forwards vendor HTTP(S) traffic to, keyed
      # by hostname. See "Reverse proxy access" below.
      PROXY_ADDR: ":3103"
      # Used to build the absolute /login?returnTo= redirect for unauthenticated
      # requests hitting the browser proxy directly.
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-http://localhost:3100}
      # Bounded in-memory audit-event queue depth (Slice 5) before the
      # data-plane starts dropping events rather than blocking the proxy.
      AUDIT_QUEUE_CAP: ${AUDIT_QUEUE_CAP:-10000}
    ports:
      - "3101:3101" # connector WSS (exposed)
      - "3103:3103" # browser-facing identity-aware proxy (exposed); 3102 internal API is NOT published

volumes:
  access_pgdata: {}
