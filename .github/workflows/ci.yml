name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  rls-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: access
          POSTGRES_PASSWORD: test
          POSTGRES_DB: captivo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U access" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: postgresql://access:test@localhost:5432/captivo_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.14.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: DATABASE_URL=$DB_URL npx prisma db push --schema=prisma/schema.prisma
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: psql "$DB_URL" -v ON_ERROR_STOP=1 -f prisma/rls/pre-push.sql
      - run: psql "$DB_URL" -v ON_ERROR_STOP=1 -v app_password="rls_test_pw" -f prisma/rls/bootstrap.sql
      # Each integration file runs in its own process: the withTenant test sets
      # process-wide env (MULTI_TENANT/APP_DATABASE_URL) and dynamically imports
      # the db module, so it must not share a worker with the other file.
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/rls.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/rls.withtenant.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/resolve.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/platform.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/resolvers.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/autoscope.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/internal.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/tenant/internal-endpoints.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/app/api/internal/audit/log/route.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/connector/enrollment.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/cron/for-each-tenant.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/dashboard/insights.scope.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/app/api/admin/smtp/route.scope.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/app/api/auth/oidc/start/route.scope.integration.test.ts
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run "src/app/api/gateway/[siteId]/consent/route.scope.integration.test.ts"
      - run: TEST_DATABASE_URL=$DB_URL npx vitest run src/lib/settings/recording-mode.integration.test.ts
