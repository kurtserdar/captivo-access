name: Publish images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          # Manager + data-plane run on the operator's server (amd64); the
          # connector runs on diverse hardware (Macs, ARM boxes, Raspberry Pi),
          # so it's the one image published multi-arch.
          - image: manager
            dockerfile: Dockerfile
            platforms: linux/amd64
          - image: dataplane
            dockerfile: dataplane/Dockerfile
            platforms: linux/amd64
          - image: connector
            dockerfile: connector/Dockerfile
            platforms: linux/amd64,linux/arm64
          - image: migrate
            dockerfile: migrate/Dockerfile
            platforms: linux/amd64
          - image: browser
            dockerfile: browser/Dockerfile
            platforms: linux/amd64
          - image: kasm-browser
            dockerfile: kasm-browser/Dockerfile
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/captivo-access-${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}

  # Publish a GitHub Release for the tag once the images are built, so the
  # in-app update check (which reads releases/latest) reflects the newest
  # version. Idempotent: skips if a release for the tag already exists.
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          fi
